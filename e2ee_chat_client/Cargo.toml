[package]
name = "e2ee_chat_client"
version = "0.3.0"
edition = "2024"
description = "An E2EE chat client."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
prost = "0.14"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30" }
unicode-width = "0.2"
tui-textarea-2 = "0.13.2"
primitives = { path = "../primitives" }
x3dh = { path = "../x3dh" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
parking_lot = "0.12"
mime_guess = "2.0"
mime = "0.3"
# chafa-dyn (default) links the system libchafa, which the release runners don't have.
ratatui-image = { version = "11.1", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }
regex = "1.13"
lru = "0.19"
image = "0.25"
sha2 = "0.11"
