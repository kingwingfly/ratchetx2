[package]
name = "e2ee_chat_preview"
version = "0.3.0"
edition = "2024"
publish = false
description = "The E2EE chat web client's file previews that run in web workers: PDF pages, Mermaid diagrams and highlighted code."
keywords = ["E2EE", "preview", "pdf", "mermaid", "tree-sitter"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[features]
# The engines, each run by its worker; the web client takes none, only the table of languages.
pdf = ["dep:hayro"]
audio = ["dep:lofty"]
search = ["dep:regex"]
diagram = ["dep:merman", "dep:serde_json"]
code = [
    "dep:arborium",
    "dep:arborium-bash",
    "dep:arborium-c",
    "dep:arborium-c-sharp",
    "dep:arborium-cpp",
    "dep:arborium-css",
    "dep:arborium-dart",
    "dep:arborium-diff",
    "dep:arborium-dockerfile",
    "dep:arborium-elixir",
    "dep:arborium-go",
    "dep:arborium-haskell",
    "dep:arborium-html",
    "dep:arborium-ini",
    "dep:arborium-java",
    "dep:arborium-javascript",
    "dep:arborium-jsdoc",
    "dep:arborium-json",
    "dep:arborium-julia",
    "dep:arborium-kotlin",
    "dep:arborium-lua",
    "dep:arborium-make",
    "dep:arborium-markdown",
    "dep:arborium-nix",
    "dep:arborium-ocaml",
    "dep:arborium-php",
    "dep:arborium-proto",
    "dep:arborium-python",
    "dep:arborium-ruby",
    "dep:arborium-rust",
    "dep:arborium-scala",
    "dep:arborium-scss",
    "dep:arborium-sql",
    "dep:arborium-swift",
    "dep:arborium-toml",
    "dep:arborium-tsx",
    "dep:arborium-typescript",
    "dep:arborium-vue",
    "dep:arborium-xml",
    "dep:arborium-yaml",
    "dep:arborium-zig",
]
# Serving a page's requests in a web worker.
worker = ["dep:console_error_panic_hook", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
# Tree-sitter's grammars and highlight queries, a crate a language: each worker links only its own.
arborium = { version = "2.18", optional = true }
arborium-bash = { version = "2.18", optional = true }
arborium-c = { version = "2.18", optional = true }
arborium-c-sharp = { version = "2.18", optional = true }
arborium-cpp = { version = "2.18", optional = true }
arborium-css = { version = "2.18", optional = true }
arborium-dart = { version = "2.18", optional = true }
arborium-diff = { version = "2.18", optional = true }
arborium-dockerfile = { version = "2.18", optional = true }
arborium-elixir = { version = "2.18", optional = true }
arborium-go = { version = "2.18", optional = true }
arborium-haskell = { version = "2.18", optional = true }
arborium-html = { version = "2.18", optional = true }
arborium-ini = { version = "2.18", optional = true }
arborium-java = { version = "2.18", optional = true }
arborium-javascript = { version = "2.18", optional = true }
arborium-jsdoc = { version = "2.18", optional = true }
arborium-json = { version = "2.18", optional = true }
arborium-julia = { version = "2.18", optional = true }
arborium-kotlin = { version = "2.18", optional = true }
arborium-lua = { version = "2.18", optional = true }
arborium-make = { version = "2.18", optional = true }
arborium-markdown = { version = "2.18", optional = true }
arborium-nix = { version = "2.18", optional = true }
arborium-ocaml = { version = "2.18", optional = true }
arborium-php = { version = "2.18", optional = true }
arborium-proto = { version = "2.18", optional = true }
arborium-python = { version = "2.18", optional = true }
arborium-ruby = { version = "2.18", optional = true }
arborium-rust = { version = "2.18", optional = true }
arborium-scala = { version = "2.18", optional = true }
arborium-scss = { version = "2.18", optional = true }
arborium-sql = { version = "2.18", optional = true }
arborium-swift = { version = "2.18", optional = true }
arborium-toml = { version = "2.18", optional = true }
arborium-tsx = { version = "2.18", optional = true }
arborium-typescript = { version = "2.18", optional = true }
arborium-vue = { version = "2.18", optional = true }
arborium-xml = { version = "2.18", optional = true }
arborium-yaml = { version = "2.18", optional = true }
arborium-zig = { version = "2.18", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
hayro = { version = "0.8", optional = true }
js-sys = { version = "0.3", optional = true }
lofty = { version = "0.25", optional = true }
regex = { version = "1.13", optional = true }
# Without the ELK layout, which is under the EPL-2.0.
merman = { version = "0.9.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape", "math"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console", "DedicatedWorkerGlobalScope", "MessageEvent"], optional = true }

# The workers, which the web client's trunk build compiles to WebAssembly.
[[bin]]
name = "preview_pdf"
required-features = ["pdf", "worker"]

[[bin]]
name = "preview_audio"
required-features = ["audio", "worker"]

[[bin]]
name = "preview_search"
required-features = ["search", "worker"]

[[bin]]
name = "preview_diagram"
required-features = ["diagram", "worker"]

[[bin]]
name = "preview_code_web"
required-features = ["code", "worker"]

[[bin]]
name = "preview_code_systems"
required-features = ["code", "worker"]

[[bin]]
name = "preview_code_apps"
required-features = ["code", "worker"]

[[bin]]
name = "preview_code_scripts"
required-features = ["code", "worker"]
