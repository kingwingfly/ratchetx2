[package]
name = "session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The E2EE chat's client flow: publish prekeys, start or accept sessions, send and receive."
publish = false

[dependencies]
aes-gcm.workspace = true
bon.workspace = true
bytes.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
party = { path = "../party", default-features = false }
prost.workspace = true
protocol = { path = "../protocol", default-features = false, features = ["pq"] }
ratchetx2 = { path = "../ratchetx2", version = "0.5" }
serde = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
web-time.workspace = true
x3dh = { path = "../x3dh" }
xeddsa = { path = "../xeddsa" }
zeroize.workspace = true

[build-dependencies]
prost-build = { workspace = true, optional = true }
protox = { workspace = true, optional = true }

[dev-dependencies]
protocol = { path = "../protocol", features = ["server", "connect", "pq"] }
storage = { path = "../storage", features = ["pq"] }
tokio.workspace = true

[features]
default = ["protox"]
# Compile the .proto files with protox, so protoc is not needed.
protox = ["party/protox", "protocol/protox"]
# Serialize the client's and the sessions' states, to keep them between runs.
serde = ["dep:serde", "party/serde", "x3dh/serde", "xeddsa/serde"]
# The states as protobuf messages too, from proto/session.proto.
prost = [
    "dep:prost-build",
    "dep:protox",
    "party/prost",
    "x3dh/prost",
]
# Connect clients over any HTTP client, see `protocol::connect`.
connect = ["protocol/connect"]
# Optional ML-KEM-1024 post-quantum handshake (PQXDH) and KEM ratchet suite.
ml-kem-1024 = ["x3dh/ml-kem-1024", "party/ml-kem-1024", "protocol/pq"]
# Optional ML-KEM-768 post-quantum handshake (PQXDH) and KEM ratchet suite.
ml-kem-768 = ["x3dh/ml-kem-768", "party/ml-kem-768", "protocol/pq"]
# All optional post-quantum suites (ML-KEM-1024 and ML-KEM-768).
pq = ["ml-kem-1024", "ml-kem-768", "x3dh/pq", "party/pq", "protocol/pq"]
