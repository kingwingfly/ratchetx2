[package]
name = "session"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "The E2EE chat's client flow: publish prekeys, start or accept sessions, send and receive."
publish = false

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
bon = "3.10"
bytes = "1"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
party = { path = "../party", default-features = false }
prost = "0.14"
protocol = { path = "../protocol", default-features = false }
ratchetx2 = { path = "../ratchetx2", version = "0.4" }
rkyv = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.11"
thiserror = "2.0"
web-time = "1.1"
x3dh = { path = "../x3dh" }
xeddsa = { path = "../xeddsa" }
zeroize = { version = "1.9", features = ["derive"] }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
protox = { version = "0.10", optional = true }

[dev-dependencies]
protocol = { path = "../protocol", features = ["server", "connect"] }
storage = { path = "../storage" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[features]
default = ["protox"]
# Compile the .proto files with protox, so protoc is not needed.
protox = ["dep:protox", "party/protox", "protocol/protox"]
# Serialize the client's and the sessions' states, to keep them between runs.
serde = ["dep:serde", "party/serde", "x3dh/serde", "xeddsa/serde"]
rkyv = ["dep:rkyv", "party/rkyv", "x3dh/rkyv", "xeddsa/rkyv"]
# The states as protobuf messages too, from proto/session.proto.
prost = [
    "dep:prost-build",
    "party/prost",
    "x3dh/prost",
]
# Connect clients over any HTTP client, see `protocol::connect`.
connect = ["protocol/connect"]
