syntax = "proto3";

// What the chat's client keeps between runs. It holds private keys, so keep it secret.
package session.v1;

import "party_state.proto";
import "x3dh.proto";

// A client's state: its identity, prekeys and the last signed request's timestamp.
message ClientState {
  // The identity's XEdDSA private key (32 bytes).
  bytes identity = 1;
  // The private prekeys; none if missing.
  x3dh.v1.LocalPrekeys prekeys = 2;
  // Milliseconds since the Unix epoch of the last signed request.
  uint64 last_timestamp = 3;
  // Whether the last publish of the prekeys may have failed, though the server may have them:
  // the next publishes the same signed prekey again, with new one-time prekeys.
  bool publishing = 4;
}

// An earlier session, which only decrypts.
message EarlierSession {
  // Its double-ratchet party.
  party.v1.Party party = 1;
  // Its delivery key (32 bytes).
  bytes delivery_key = 2;
}

// A session's state.
message SessionState {
  // The double-ratchet party of the active session, which messages are sent on; none once it
  // was retired, until a new session starts.
  party.v1.Party party = 1;
  // The active session's ID, the X3DH ephemeral key of the one who started it (32 bytes).
  bytes id = 6;
  // Whether the peer is known to have the active session: it started it, or a message on it
  // decrypted.
  bool known_by_peer = 7;
  // The initial message (`handshake.v1.InitialMessage`, encoded) that started the active
  // session, which this client did, sent with each message until the peer is known to have
  // it; empty once it is.
  bytes initial_message = 12;
  // The active session's delivery key (32 bytes), from X3DH's shared secret, which both peers
  // have: each message's delivery token is HMAC-SHA256 of its header under it.
  bytes delivery_key = 13;
  // Earlier sessions with the peer, latest first, which only decrypt: messages that `party`
  // cannot decrypt are tried on them.
  repeated EarlierSession others = 5;
  // The delivery tokens of the messages received and not told to the server yet, which the
  // next fetch tells it, so that it deletes them.
  repeated bytes delivered = 14;
  // This client's identity key (32 bytes).
  bytes me = 2;
  // The peer's identity key (32 bytes).
  bytes peer = 3;
  // Sequence number of the last message fetched from the peer's queue.
  uint64 cursor = 4;
  // What was done last.
  LastAction last = 8;
  // How many times the peers turned between sending on the active session and receiving on an
  // earlier one; past a few, the active session is retired.
  uint32 direction_changes = 9;
  // The last sequence number of the page in which receiving stopped at a message that did not
  // decrypt, which may be on a session whose initial message is waiting.
  uint64 stalled_through = 10;
  // Up to this sequence number, messages that do not decrypt are skipped: the initial messages
  // were taken since.
  uint64 skip_through = 11;
}

// What was done last on a session.
enum LastAction {
  // Nothing yet.
  LAST_ACTION_NONE = 0;
  // A message was encrypted on the active session.
  LAST_ACTION_SENT = 1;
  // A message decrypted on the active session.
  LAST_ACTION_RECEIVED_ACTIVE = 2;
  // A message decrypted on an earlier session.
  LAST_ACTION_RECEIVED_EARLIER = 3;
}
