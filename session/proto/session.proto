syntax = "proto3";

// What the chat's client keeps between runs. It holds private keys, so keep it secret.
package session.v1;

import "party_state.proto";
import "x3dh.proto";

// A client's state: its identity, prekeys, signed-request timestamp, and unified mailbox cursors.
message ClientState {
  // The identity's XEdDSA private key (32 bytes).
  bytes identity = 1;
  // The private prekeys; none if missing.
  x3dh.v1.LocalPrekeys prekeys = 2;
  // Milliseconds since the Unix epoch of the last signed request.
  uint64 last_timestamp = 3;
  // Whether the last publish of the prekeys may have failed, though the server may have them:
  // the next publishes the same signed prekey again, with new one-time prekeys.
  bool publishing = 4;
  // Inverted so existing vaults (where field 5 is absent/false) default to PQ ON when compiled.
  bool pq_disabled = 5;
  // Preferred ML-KEM suite ID (0 = default compiled suite, 1 = ML-KEM-1024, 2 = ML-KEM-768).
  uint32 preferred_pq_suite = 6;
  // Inverted so existing vaults default to PQ ratchet ON when PQ is enabled.
  bool pq_ratchet_disabled = 7;
  // Strict / Require-PQ mode: refuse classical fallback and omit raw SPK signature.
  bool strict_pq = 8;
  // Monotonic CapabilityManifest sequence number published via HandshakeV2.
  uint64 manifest_seq = 9;
  // Monotonic prekey generation number published via HandshakeV2.
  uint64 prekey_generation = 10;
  // SHA-256 digests (32 bytes each) of recent CapabilityManifests signed by this client,
  // bounded so accept_initial_v2 can verify incoming manifest_digest values belong to this client.
  repeated bytes recent_manifest_digests = 11;
  // Unified mailbox high-water sequence number last committed locally.
  uint64 mailbox_cursor = 12;
  // Unified mailbox sequence number committed locally and awaiting server prefix ACK (0 if none).
  uint64 pending_mailbox_ack = 13;
  // Identity-wide monotonic write-token grant version counter (starts at 1; 0 treated as 1).
  uint64 next_grant_version = 14;
  // SHA-256 digests (32 bytes each) of CapabilityManifests confirmed stored on the relay
  // (bounded <= 16); prioritized ahead of unconfirmed staged digests so repeated failed
  // publish attempts cannot evict the last confirmed relay manifest digest.
  repeated bytes confirmed_manifest_digests = 15;
}

// Per-peer post-quantum pinning, downgrade-detection, and anti-rollback state.
message PeerPqState {
  // Whether the peer is pinned as post-quantum capable.
  bool pq_pinned = 1;
  // Highest verified CapabilityManifest.manifest_seq observed for this peer.
  uint64 pinned_manifest_seq = 2;
  // Explicit user-approved exception permitting classical fallback with this peer.
  bool allow_classical_exception = 3;
  // Whether a downgrade attack or contradictory Hello.pq_capable was detected.
  bool downgrade_detected = 4;
  // Whether the peer is known to be post-quantum capable.
  bool peer_pq_capable = 5;
  // Monotonic high-water mark of Hello.session_seq accepted from this peer.
  uint64 peer_session_seq = 6;
  // SHA-256 digest (32 bytes) of the verified CapabilityManifest at pinned_manifest_seq; empty
  // if unset (e.g. before any manifest has been observed).
  bytes pinned_manifest_digest = 7;
}

// Cryptographic security metadata of an established session.
message SessionSecurity {
  // Whether this session used PQXDH.
  bool is_pq = 1;
  // Negotiated ML-KEM suite ID (0 = none/classical, 1 = ML-KEM-1024, 2 = ML-KEM-768).
  uint32 suite = 2;
  // Whether continuous post-quantum KEM ratcheting is active.
  bool pq_ratchet = 3;
}

// An earlier session, which only decrypts.
message EarlierSession {
  // Its double-ratchet party.
  party.v1.Party party = 1;
  // SHA-256 of the peer's deniable write token for this session (32 bytes, for O(1) routing).
  bytes inbound_token_hash = 2;
}

// A write-token grant staged on a session until registered on the recipient's mailbox relay.
message PendingGrant {
  // SHA-256 of the peer's deniable write token (32 bytes).
  bytes token_hash = 1;
  // Strictly positive monotonic identity-wide grant version (1..=2^53 - 1).
  uint64 grant_version = 2;
  // Whether to pin this token as the peer's active grant on the relay.
  bool pin_active = 3;
}

// A session's state.
message SessionState {
  // Legacy v1/per-peer cursor, stall, and delivery-token fields removed in v3 cutover.
  reserved 4, 10, 11, 13, 14;

  // The double-ratchet party of the active session, which messages are sent on; none once it
  // was retired, until a new session starts.
  party.v1.Party party = 1;
  // The active session's ID, the X3DH/PQXDH ephemeral key of the one who started it (32 bytes).
  bytes id = 6;
  // Whether the peer is known to have the active session: it started it, or a message on it
  // decrypted.
  bool known_by_peer = 7;
  // The initial message (`handshake.v2.InitialMessageV2`, encoded) that started the active
  // session, which this client did, sent with each message until the peer is known to have
  // it; empty once it is.
  bytes initial_message = 12;
  // Earlier sessions with the peer, latest first, which only decrypt: messages that `party`
  // cannot decrypt are tried on them.
  repeated EarlierSession others = 5;
  // This client's identity key (32 bytes).
  bytes me = 2;
  // The peer's identity key (32 bytes).
  bytes peer = 3;
  // What was done last.
  LastAction last = 8;
  // How many times the peers turned between sending on the active session and receiving on an
  // earlier one; past a few, the active session is retired.
  uint32 direction_changes = 9;
  // Per-peer post-quantum pinning, downgrade-detection, and anti-rollback state.
  PeerPqState peer_pq = 15;
  // Next outgoing monotonic Hello.session_seq for this peer (0 treated as 1).
  uint64 next_session_seq = 16;
  // Security level of the active session (absent/default for classical).
  SessionSecurity active_security = 17;
  // Peer's Hello.session_seq that created the active session (0 if local or unset).
  uint64 active_peer_session_seq = 18;
  // Active session's secret outgoing write token `t_{me->peer}` (32 bytes; empty when retired).
  bytes send_write_token = 19;
  // SHA-256 of the active session's inbound write token `t_{peer->me}` (32 bytes; empty when retired).
  bytes inbound_token_hash = 20;
  // Pending write-token registrations queued for this peer (at most 4).
  repeated PendingGrant pending_register_grants = 21;
}

// What was done last on a session.
enum LastAction {
  // Nothing yet.
  LAST_ACTION_UNSPECIFIED = 0;
  // A message was encrypted on the active session.
  LAST_ACTION_SENT = 1;
  // A message decrypted on the active session.
  LAST_ACTION_RECEIVED_ACTIVE = 2;
  // A message decrypted on an earlier session.
  LAST_ACTION_RECEIVED_EARLIER = 3;
}
