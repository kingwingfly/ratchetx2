version: v2
# Mirrors the include paths in the build scripts, so editors resolve imports such as
# `import "party.proto"`.
modules:
  - path: ratchetx2/proto
  - path: x3dh/proto
  - path: party/proto
  - path: protocol/proto
  - path: session/proto
lint:
  use:
    - STANDARD
  # The proto directories are flat, one file per package.
  except:
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
