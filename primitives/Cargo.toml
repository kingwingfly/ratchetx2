[package]
name = "primitives"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "E2EE chat parties on top of the ratchetx2 double ratchet, with header encryption and message transports."
publish = false

[dependencies]
ratchetx2 = { path = "../ratchetx2", version = "0.4" }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
futures = "0.3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
parking_lot = "0.12"
prost = "0.14"
sha2 = "0.11"
thiserror = "2.0"
trait-variant = "0.1"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]
