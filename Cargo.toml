[workspace]
members = [
    "e2ee_chat_client",
    "e2ee_chat_server",
    "party",
    "protocol",
    "ratchetx2",
    "session",
    "storage",
    "x3dh",
    "xeddsa",
]
resolver = "2"

[profile.dev.package.image]
opt-level = 3

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "debuginfo"
panic = "abort"
