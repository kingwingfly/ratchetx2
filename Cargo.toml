[workspace]
members = [
    "e2ee_chat_preview",
    "e2ee_chat_web",
    "e2ee_chat_worker",
    "party",
    "protocol",
    "ratchetx2",
    "session",
    "storage",
    "x3dh",
    "xeddsa",
]
resolver = "2"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# The web client's Mermaid worker, the most Rust code it loads: built for size, it takes 40%
# less, and still draws a diagram in milliseconds. The grammars' workers are mostly tables, which
# this would not shrink.
[profile.size]
inherits = "release"
opt-level = "z"
