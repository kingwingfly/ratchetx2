[build]
target = "index.html"
dist = "dist"
# Content-hashed assets with no inline script, so that the Content-Security-Policy in `_headers`
# can forbid inline scripts: `scripts/post_build.sh` rewrites and hashes `init.js` and injects the
# non-executable `<meta name="e2ee-worker-manifest">` worker loader map.
filehash = true
inject_scripts = false

[serve]
addresses = ["127.0.0.1"]
port = 8080

# During `trunk serve`, the Connect calls go to `wrangler dev`, as they would to the Worker.
[[proxy]]
backend = "http://127.0.0.1:8787/handshake.v2.HandshakeService/"

[[proxy]]
backend = "http://127.0.0.1:8787/mailbox.v2.MailboxService/"

[[proxy]]
backend = "http://127.0.0.1:8787/attachment.v1.AttachmentService/"

[[proxy]]
backend = "ws://127.0.0.1:8787/notifications"
ws = true

# Signing in, whose cookie the browser then keeps for this page, as it would for the Worker's.
[[proxy]]
backend = "http://127.0.0.1:8787/auth"

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/post_build.sh"]
