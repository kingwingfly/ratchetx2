[package]
name = "e2ee_chat_web"
version = "0.3.0"
edition.workspace = true
publish = false
description = "The E2EE chat's web client, in Leptos."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["pq"]
ml-kem-1024 = ["session/ml-kem-1024", "party/ml-kem-1024"]
ml-kem-768 = ["session/ml-kem-768", "party/ml-kem-768"]
pq = ["ml-kem-1024", "ml-kem-768", "session/pq", "party/pq"]

[dependencies]
aes-gcm.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64.workspace = true
bytes.workspace = true
console_error_panic_hook.workspace = true
# File previews: CSV tables, tar.gz listings, Markdown, maths in it as MathML, and ZIP listings.
crc32fast = "1"
csv = "1.4"
data-url = "0.3"
# Which of the previews' workers highlights what; the workers themselves are its binaries.
e2ee_chat_preview = { path = "../e2ee_chat_preview", features = ["rpc"] }
flate2 = "1.1"
form_urlencoded = "1"
futures-channel = "0.3"
futures-util = { workspace = true, features = ["std"] }
getrandom = { workspace = true, features = ["wasm_js"] }
idb = "0.6"
js-sys.workspace = true
leptos = { version = "0.8", features = ["csr"] }
party = { path = "../party" }
percent-encoding = "2"
prost.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
scopeguard = "1"
# `prost`: the vault keeps the states as protobuf messages.
session = { path = "../session", features = ["connect", "prost"] }
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
unicode-general-category = "1"
url = { workspace = true, default-features = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CloseEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MessagePort",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "NodeList",
    "PageTransitionEvent",
    "Performance",
    "PopStateEvent",
    "ProgressEvent",
    "Range",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "Storage",
    "TreeWalker",
    "Url",
    "WebSocket",
    "Window",
    "Worker",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestResponseType",
    "XmlHttpRequestUpload",
] }
zeroize.workspace = true
zip = { version = "9.8", default-features = false }

[dev-dependencies]
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
png = "0.18"
rqrr = "0.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
