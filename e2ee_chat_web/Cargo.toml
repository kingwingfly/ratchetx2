[package]
name = "e2ee_chat_web"
version = "0.3.0"
edition = "2024"
publish = false
description = "The E2EE chat's web client, in Leptos."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[features]
default = ["pq"]
ml-kem-1024 = ["session/ml-kem-1024", "party/ml-kem-1024"]
ml-kem-768 = ["session/ml-kem-768", "party/ml-kem-768"]
pq = ["ml-kem-1024", "ml-kem-768", "session/pq", "party/pq"]

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
bytes = "1"
console_error_panic_hook = "0.1"
# File previews: CSV tables, tar.gz listings, Markdown, maths in it as MathML, and ZIP listings.
crc32fast = "1"
csv = "1.4"
data-url = "0.3"
# Which of the previews' workers highlights what; the workers themselves are its binaries.
e2ee_chat_preview = { path = "../e2ee_chat_preview", features = ["rpc"] }
flate2 = "1.1"
form_urlencoded = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
idb = "0.6"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
party = { path = "../party" }
percent-encoding = "2"
prost = "0.14"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
scopeguard = "1"
# `prost`: the vault keeps the states as protobuf messages.
session = { path = "../session", features = ["connect", "prost"] }
serde_json = "1"
sha2 = { version = "0.11", features = ["zeroize"] }
tar = { version = "0.4", default-features = false }
unicode-general-category = "1"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CloseEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MessagePort",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "NodeList",
    "PageTransitionEvent",
    "Performance",
    "PopStateEvent",
    "ProgressEvent",
    "Range",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "Storage",
    "TreeWalker",
    "Url",
    "WebSocket",
    "Window",
    "Worker",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestResponseType",
    "XmlHttpRequestUpload",
] }
zeroize = "1.9"
zip = { version = "9.8", default-features = false }

[dev-dependencies]
futures = "0.3"
