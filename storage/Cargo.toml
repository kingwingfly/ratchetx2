[package]
name = "storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "Typed storage for the handshake and mailbox servers, with pluggable backends."
publish = false

[dependencies]
bytes = "1"
parking_lot = { version = "0.12", optional = true }
thiserror = "2.0"
trait-variant = "0.1"
xeddsa = { path = "../xeddsa" }

[dev-dependencies]
futures = "0.3"

[features]
default = ["memory"]
# In-memory backend, for tests and development servers.
memory = ["dep:parking_lot"]
# Conformance suites every backend should pass.
testing = []
