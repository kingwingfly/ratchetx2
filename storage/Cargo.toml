[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed storage for the handshake and mailbox servers, with pluggable backends."
publish = false

[dependencies]
bytes.workspace = true
parking_lot = { version = "0.13", optional = true }
serde = { workspace = true, optional = true }
serde-big-array = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
trait-variant.workspace = true
web-time = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
postcard.workspace = true
serde_json.workspace = true

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
xeddsa = { path = "../xeddsa" }

[features]
default = ["memory"]
# In-memory backend, for tests and development servers.
memory = ["dep:parking_lot", "dep:subtle", "dep:web-time"]
# Derive `serde::Serialize` and `serde::Deserialize` on storage records for RPC/DO serialization.
serde = ["dep:serde", "dep:serde-big-array", "bytes/serde"]
# Conformance suites every backend should pass.
testing = []
