[package]
name = "storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "Typed storage for the handshake and mailbox servers, with pluggable backends."
publish = false

[dependencies]
bytes = "1"
parking_lot = { version = "0.13", optional = true }
thiserror = "2.0"
trait-variant = "0.1"
web-time = { version = "1.1", optional = true }

[dev-dependencies]
futures = "0.3"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
xeddsa = { path = "../xeddsa" }

[features]
default = ["memory"]
# In-memory backend, for tests and development servers.
memory = ["dep:parking_lot", "dep:web-time"]
# Optional post-quantum handshake & idempotent mailbox storage traits (zero ML-KEM deps).
pq = []
# Conformance suites every backend should pass.
testing = []
