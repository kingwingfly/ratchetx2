[package]
name = "xeddsa"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "XEdDSA: one key pair for both X25519 Diffie-Hellman and Ed25519-style signatures."
publish = false

[dependencies]
curve25519-dalek = "5.0"
ed25519-dalek = "3.0"
getrandom = "0.4"
rkyv = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
zeroize = { version = "1.9", features = ["derive"] }

[features]
# Serialize private keys, to keep them between runs.
serde = ["dep:serde", "curve25519-dalek/serde"]
rkyv = ["dep:rkyv"]
