[package]
name = "ratchetx2"
version = "0.4.0"
edition = "2024"
keywords = ["E2EE", "double-ratchet", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
documentation = "https://docs.rs/ratchetx2"
description = "A double-ratchet implementation for building an E2EE message exchange app."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
curve25519-dalek = "5.0"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
prost = { version = "0.14", optional = true }
rkyv = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.11"
thiserror = "2.0"
zeroize = { version = "1.9", features = ["derive"] }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
protox = { version = "0.10", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
# Serialize ratchets, to keep a session between runs.
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]
# The ratchet's state as protobuf messages, from proto/ratchetx2.proto, compiled with protox.
prost = ["dep:prost", "dep:prost-build", "dep:protox"]
