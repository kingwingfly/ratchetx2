[package]
name = "ratchetx2"
version = "0.4.1"
edition.workspace = true
keywords = ["E2EE", "double-ratchet", "signal"]
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ratchetx2"
description = "A double-ratchet implementation for building an E2EE message exchange app."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
curve25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
ml-kem = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
prost-build = { workspace = true, optional = true }
protox = { workspace = true, optional = true }

[dev-dependencies]
postcard.workspace = true
serde_json.workspace = true

[features]
# Serialize ratchets, to keep a session between runs.
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]
# The ratchet's state as protobuf messages, from proto/ratchetx2.proto, compiled with protox.
prost = ["dep:prost", "dep:prost-build", "dep:protox"]
# Optional post-quantum KEM ratchet suites (pure Rust, wasm32-compatible).
ml-kem-1024 = ["dep:ml-kem"]
ml-kem-768 = ["dep:ml-kem"]
pq = ["ml-kem-1024", "ml-kem-768"]
