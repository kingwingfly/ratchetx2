[package]
name = "x3dh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "X3DH (Extended Triple Diffie-Hellman) key agreement, without I/O."
publish = false

[dependencies]
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
ml-kem = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-big-array = { version = "0.5", optional = true }
sha2.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "3.0", features = ["static_secrets", "zeroize"] }
xeddsa = { path = "../xeddsa" }
zeroize.workspace = true

[build-dependencies]
prost-build = { workspace = true, optional = true }
protox = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
serde = ["dep:serde", "dep:serde-big-array", "x25519-dalek/serde"]
# The local prekeys as protobuf messages, from proto/x3dh.proto, compiled with protox.
prost = ["dep:prost", "dep:prost-build", "dep:protox"]
# Optional ML-KEM-1024 post-quantum handshake (PQXDH) suite.
ml-kem-1024 = ["dep:ml-kem"]
# Optional ML-KEM-768 post-quantum handshake (PQXDH) suite.
ml-kem-768 = ["dep:ml-kem"]
# All post-quantum handshake (PQXDH) suites.
pq = ["ml-kem-1024", "ml-kem-768"]
