[package]
name = "e2ee_chat_server"
version = "0.3.0"
edition = "2024"
publish = false
description = "An E2EE chat server."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[dependencies]
protocol = { path = "../protocol", features = ["server", "grpc"] }
storage = { path = "../storage" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
clap = { version = "4.6", features = ["derive"] }
