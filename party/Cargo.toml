[package]
name = "party"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Double-ratchet message encryption with header encryption, without I/O."
publish = false

[dependencies]
ratchetx2 = { path = "../ratchetx2", version = "0.4" }
aes-gcm.workspace = true
bytes.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
prost.workspace = true
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
prost-build.workspace = true
protox = { workspace = true, optional = true }

[dev-dependencies]
postcard.workspace = true
serde_json.workspace = true

[features]
default = ["protox"]
# Compile the .proto files with protox, so protoc is not needed.
protox = ["dep:protox"]
serde = ["dep:serde", "bytes/serde", "ratchetx2/serde"]
rkyv = ["dep:rkyv", "rkyv/bytes-1", "ratchetx2/rkyv"]
# The party's state as protobuf messages too, from proto/party_state.proto.
prost = ["ratchetx2/prost"]
# Optional post-quantum KEM ratchet integration.
ml-kem-1024 = ["ratchetx2/ml-kem-1024"]
ml-kem-768 = ["ratchetx2/ml-kem-768"]
pq = ["ml-kem-1024", "ml-kem-768", "ratchetx2/pq"]
