syntax = "proto3";

// Notifications: a client learns at once that something arrived for it, instead of polling. They
// are only hints, carrying nothing secret and zero sender metadata: what arrived is still fetched
// with the handshake and mailbox services. How they travel is up to the server, e.g. over a WebSocket.
package notify.v1;

// Subscribe to the notifications of an identity. Signed with its identity key under
// "notify.v2/subscribe".
message SubscribeRequest {
  // The subscriber's identity key (32 bytes).
  bytes identity_key = 1;
  // Milliseconds since the Unix epoch; the server takes it only within a few minutes of its own
  // clock.
  uint64 timestamp = 2;
  // The identity key's XEdDSA signature of this request (64 bytes).
  bytes signature = 3;
  // Canonical relay audience bound into the "notify.v2/subscribe" signing transcript.
  string audience = 4;
  // Required 16-byte CSPRNG nonce bound into the signing transcript and replay key.
  bytes nonce = 5;
}

// Something arrived for the subscriber (zero sender/conversation metadata).
message Notification {
  oneof event {
    // A message arrived in the subscriber's unified mailbox; always true.
    bool message = 1;
    // An initial message arrived in the subscriber's inbox; always true.
    bool initial_message = 2;
  }
}
