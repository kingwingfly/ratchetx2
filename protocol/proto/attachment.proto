syntax = "proto3";

// The attachment service: files too large for a message, encrypted by their sender under a key
// of their own and uploaded in chunks, which the recipients download. A message carries the key
// and the attachment's ID; the server only sees ciphertext.
//
// An attachment has two tokens. Its upload token, random, which the server gives the uploader
// alone, uploads its chunks, and is forgotten once they are up. Its delete token, which the
// peers derive from the attachment's key, deletes it, whoever of them does, at any time: so
// holding it shows only that one knew the key, which every peer of the chat does, and names no
// uploader. Nothing about an upload is signed, and the server keeps no uploader.
package attachment.v1;

// Start uploading an attachment.
message StartUploadRequest {
  reserved 1, 3, 4, 5;
  // Number of chunks to upload.
  uint32 chunks = 2;
  // SHA-256 of its delete token (32 bytes).
  bytes delete_hash = 6;
}

// The new attachment.
message StartUploadResponse {
  // Its random ID (16 bytes), which downloading it takes.
  bytes id = 1;
  // The random token (16 bytes) that uploading its chunks takes, which deletes it too; keep it
  // to the uploader, until the upload is done.
  bytes upload_token = 2;
  // When the server deletes the attachment, in milliseconds since the Unix epoch; 0 if it does
  // not say.
  uint64 expires = 3;
}

// Upload a chunk of an attachment. Uploading it again, e.g. as the reply was lost, keeps the
// first copy.
message PutChunkRequest {
  // The attachment's ID.
  bytes id = 1;
  // Its upload token.
  bytes upload_token = 2;
  // The chunk's index, from 0.
  uint32 index = 3;
  // The chunk, encrypted, at most 2 MiB.
  bytes data = 4;
}

// Reply to `PutChunkRequest`.
message PutChunkResponse {}

// Download a chunk of an attachment.
message GetChunkRequest {
  // The attachment's ID.
  bytes id = 1;
  // The chunk's index.
  uint32 index = 2;
}

// A chunk of an attachment, or that it is not uploaded yet: the attachment is there, as it is
// downloaded while uploaded, but not this chunk. An attachment that is gone, expired or deleted,
// is a `not_found` error, and so is a chunk that was uploaded and is gone, as the server's
// storage deleted it once old.
message GetChunkResponse {
  // The chunk, as uploaded; empty unless `uploaded`.
  bytes data = 1;
  // Whether the chunk is uploaded yet.
  bool uploaded = 2;
}

// Delete an attachment, uploaded or not: it and its chunks go, and its upload stops.
message DeleteAttachmentRequest {
  // The attachment's ID.
  bytes id = 1;
  // Its upload token, or its delete token.
  bytes token = 2;
}

// Reply to `DeleteAttachmentRequest`.
message DeleteAttachmentResponse {}

// The attachment service.
service AttachmentService {
  // Start uploading an attachment.
  rpc StartUpload(StartUploadRequest) returns (StartUploadResponse);
  // Upload a chunk, once.
  rpc PutChunk(PutChunkRequest) returns (PutChunkResponse);
  // Download a chunk.
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  // Delete an attachment, with either of its tokens.
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);
}
