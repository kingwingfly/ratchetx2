syntax = "proto3";

// What a chat message carries, which a session encrypts, so the server never sees it. The web
// and TUI clients both read it, and drop the kinds they do not show.
package content.v1;

// A message's content: something to show, events of messages the other way, or both.
message Content {
  // The message's Lamport clock: one more than the highest clock of the chat's messages, both
  // ways, that its sender had sent or received when it went. A sender's clocks only go up, so
  // a message is named by its clock, which events do; and both sides show the chat by clock,
  // then by sender, the one with the lower identity key first, so alike. 0 for a message that
  // has no place in the chat, as one of events only.
  uint64 clock = 7;
  oneof kind {
    // Text.
    string text = 1;
    // An image in a format the TUI client shows: PNG, JPEG, GIF or WebP.
    bytes image = 2;
    // Any file small enough for its message.
    File file = 3;
    // The greeting that starts a session, as its first message, which the recipient needs
    // before it can write back.
    Hello hello = 4;
    // A file too large for its message, uploaded encrypted as an attachment.
    AttachmentPointer attachment = 5;
    // The sender deleted the chat, and its session with it: the recipient's next message
    // starts a new session, which comes to the sender as a new chat.
    Deleted deleted = 6;
  }
  // What the sender did with the recipient's messages since it last told.
  Events events = 8;
}

// What the recipient of messages did with them, which it tells their sender, naming each by its
// clock: as many as there are, in one message. The session authenticates them as the peer's, as
// it does every message, without a signature, so that they stay deniable. Each moves a message
// from sent on, and none back, so one told twice, or late, changes nothing.
message Events {
  // Messages read: shown to the recipient.
  repeated uint64 read = 1;
  // Attachments downloaded whole.
  repeated uint64 downloaded = 2;
}

// A file.
message File {
  // Its name, as the sender gave it.
  string name = 1;
  // Its MIME type, as the sender gave it; only a hint.
  string mime = 2;
  // Its bytes.
  bytes data = 3;
}

// A greeting.
message Hello {
  // The name the sender goes by; empty if it has none.
  string name = 1;
}

// Where an attachment is, and its key.
message AttachmentPointer {
  // Its ID at the attachment service (16 bytes).
  bytes id = 1;
  // The key its chunks are encrypted under (32 bytes).
  bytes key = 2;
  // Its size, in bytes, decrypted.
  uint64 size = 3;
  // Its name, as the sender gave it.
  string name = 4;
  // Its MIME type, as the sender gave it; only a hint.
  string mime = 5;
}

// That the sender deleted the chat. Its recipient sends again, on a new session, what the sender
// never read.
message Deleted {}
