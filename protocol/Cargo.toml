[package]
name = "protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"
description = "The E2EE chat's wire protocol: the handshake and mailbox services, their clients and servers."
publish = false

[dependencies]
bon = { version = "3.10", optional = true }
bytes = "1"
getrandom = { version = "0.4", optional = true }
party = { path = "../party", default-features = false }
prost = "0.14"
rkyv = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
storage = { path = "../storage", default-features = false, optional = true }
thiserror = "2.0"
trait-variant = "0.1"
web-time = { version = "1.1", optional = true }
x3dh = { path = "../x3dh" }
xeddsa = { path = "../xeddsa" }

[build-dependencies]
prost-build = "0.14"
protox = { version = "0.10", optional = true }

[dev-dependencies]
# Reads the services in the .proto files, to check the Connect paths.
protox = "0.10"
storage = { path = "../storage" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[features]
default = ["protox"]
# Compile the .proto files with protox, so protoc is not needed.
protox = ["dep:protox", "party/protox"]
serde = ["dep:serde", "bytes/serde", "party/serde"]
rkyv = ["dep:rkyv", "rkyv/bytes-1", "party/rkyv"]
# The servers' logic, over the `storage` traits.
server = ["dep:bon", "dep:getrandom", "dep:sha2", "dep:storage", "dep:web-time"]
# Connect clients and call handling over any HTTP stack, e.g. in browsers and Workers.
connect = ["dep:serde", "dep:serde_json"]
