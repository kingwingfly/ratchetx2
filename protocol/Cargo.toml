[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The E2EE chat's wire protocol: the handshake and mailbox services, their clients and servers."
publish = false

[dependencies]
bon = { workspace = true, optional = true }
bytes.workspace = true
getrandom = { workspace = true, optional = true }
party = { path = "../party", default-features = false }
prost.workspace = true
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
storage = { path = "../storage", default-features = false, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
trait-variant.workspace = true
url.workspace = true
web-time = { workspace = true, optional = true }
x3dh = { path = "../x3dh" }
xeddsa = { path = "../xeddsa" }
zeroize.workspace = true

[build-dependencies]
prost-build.workspace = true
protox = { workspace = true, optional = true }

[dev-dependencies]
# Reads the services in the .proto files, to check the Connect paths.
protox.workspace = true
storage = { path = "../storage" }
tokio.workspace = true

[features]
default = ["protox"]
# Compile the .proto files with protox, so protoc is not needed.
protox = ["dep:protox", "party/protox"]
serde = ["dep:serde", "bytes/serde", "party/serde"]
rkyv = ["dep:rkyv", "rkyv/bytes-1", "party/rkyv"]
# The servers' logic, over the `storage` traits.
server = ["dep:bon", "dep:getrandom", "dep:sha2", "dep:storage", "dep:subtle", "dep:web-time"]
# Connect clients and call handling over any HTTP stack, e.g. in browsers and Workers.
connect = ["dep:serde", "dep:serde_json"]
# Optional post-quantum handshake.v2 and mailbox.v2 protocol layer (zero ML-KEM deps).
pq = ["storage?/pq", "dep:sha2"]
