name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust components and wasm32 target
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # clang and llvm-ar compile the C grammars of the web client's code previews to WebAssembly.
      - name: Install protoc, clang, and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang llvm

      - name: Run tests
        run: .github/scripts/test.sh
