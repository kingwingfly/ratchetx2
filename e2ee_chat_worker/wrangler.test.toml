name = "e2ee-chat-test"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# Test-only configuration for local `workerd` (`@cloudflare/vitest-pool-workers`) integration tests.
# Explicitly omits `[build]`, `[assets]`, and `[secrets] required` so `--features conformance`
# builds can never leak into production deploys and Miniflare accepts test values via `[vars]`.

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "e2ee-chat-test"

[[durable_objects.bindings]]
name = "IDENTITIES"
class_name = "IdentityV2"

[[durable_objects.bindings]]
name = "ATTACHMENTS"
class_name = "AttachmentV2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IdentityV2", "AttachmentV2"]

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "WS_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "HANDSHAKE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[vars]
RETENTION_DAYS = "30"
FILE_RETENTION_DAYS = "90"
SESSION_DAYS = "30"
PQ_ENABLED = "true"
PASSWORD = "test-server-password"
AUTH_KEY = "test-cookie-signing-key-for-workerd"
CONFORMANCE_TOKEN = "test-conformance-token"
