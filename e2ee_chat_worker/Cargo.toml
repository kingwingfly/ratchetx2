[package]
name = "e2ee_chat_worker"
version = "0.3.0"
edition = "2024"
publish = false
description = "The E2EE chat server as a Cloudflare Worker, over Durable Objects and R2."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.13"
postcard = { version = "1", default-features = false, features = ["alloc"] }
prost = "0.14"
protocol = { path = "../protocol", features = ["server", "connect"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
storage = { path = "../storage", default-features = false }
# The `#[durable_object]` macro expands to wasm-bindgen code.
wasm-bindgen = "0.2"
worker = "0.8"

[features]
# `POST /conformance` runs the storage conformance suites against the bindings, which must be
# empty, e.g. a fresh `wrangler dev`. Never deploy it.
conformance = ["storage/testing"]
