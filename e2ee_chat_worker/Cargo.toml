[package]
name = "e2ee_chat_worker"
version = "0.3.0"
edition = "2024"
publish = false
description = "The E2EE chat server as a Cloudflare Worker, over Durable Objects and R2."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license = "MIT"
authors = ["Louis <836250617@qq.com>"]
repository = "https://github.com/kingwingfly/ratchetx2"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = { version = "0.13", features = ["zeroize"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
prost = "0.14"
protocol = { path = "../protocol", features = ["server", "connect", "pq"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = { version = "0.11", features = ["zeroize"] }
storage = { path = "../storage", default-features = false, features = ["pq"] }
# The `#[durable_object]` macro expands to wasm-bindgen code.
wasm-bindgen = "0.2"
worker = "0.9"
xeddsa = { path = "../xeddsa" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
storage = { path = "../storage", features = ["memory", "pq"] }

[features]
default = ["pq"]
# Retained as a no-op feature for compatibility; handshake.v2 and mailbox.v2 routes & storage are
# always enabled (zero ML-KEM deps) and controlled at runtime via `PQ_ENABLED`.
pq = []
# `POST /conformance` runs the storage conformance suites against the bindings, which must be
# empty, e.g. a fresh `wrangler dev`. Never deploy it.
conformance = ["storage/testing"]
