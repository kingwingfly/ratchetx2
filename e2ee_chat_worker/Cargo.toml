[package]
name = "e2ee_chat_worker"
version = "0.3.0"
edition.workspace = true
publish = false
description = "The E2EE chat server as a Cloudflare Worker, over Durable Objects and R2."
keywords = ["E2EE", "double-ratchet", "xeddsa", "XEdDSA", "signal"]
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
base64.workspace = true
const-hex.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true, features = ["wasm_js"] }
hmac.workspace = true
postcard.workspace = true
prost.workspace = true
protocol = { path = "../protocol", features = ["server", "connect"] }
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
sha2.workspace = true
storage = { path = "../storage", default-features = false, features = ["serde"] }
subtle.workspace = true
# The `#[durable_object]` macro expands to wasm-bindgen code.
wasm-bindgen.workspace = true
worker = "0.9"
xeddsa = { path = "../xeddsa" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
storage = { path = "../storage", features = ["memory", "serde"] }

[features]
# `POST /conformance` runs the storage conformance suites against the bindings, which must be
# empty, e.g. a fresh `wrangler dev`. Never deploy it.
conformance = ["storage/testing"]
