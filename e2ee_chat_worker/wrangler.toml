name = "e2ee-chat"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# Builds the web client into ../e2ee_chat_web/dist, then the Worker, passing WORKER_BUILD_ARGS
# on to cargo, e.g. "--features conformance".
[build]
command = "cd ../e2ee_chat_web && trunk build --release && cd ../e2ee_chat_worker && worker-build --release $WORKER_BUILD_ARGS"
watch_dir = ["src", "../e2ee_chat_web/src", "../e2ee_chat_web/index.html", "../e2ee_chat_web/style.css", "../e2ee_chat_web/_headers", "../e2ee_chat_preview/src"]

# The web client. Files are served before the Worker runs; other paths, such as the Connect
# procedures', go to the Worker.
[assets]
directory = "../e2ee_chat_web/dist"

# Message contents over 64 KiB and attachments' chunks. Create it with
# `npx wrangler r2 bucket create e2ee-chat`.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "e2ee-chat"

# The server's state, in SQLite-backed Durable Objects, as the Free plan requires: an object per
# identity key, keeping its prekeys, its inbox, the messages to it and its client's WebSockets;
# and an object per attachment. Each deletes what expires with an alarm.
[[durable_objects.bindings]]
name = "IDENTITIES"
class_name = "Identity"

[[durable_objects.bindings]]
name = "ATTACHMENTS"
class_name = "Attachment"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Identity", "Attachment"]

# How long, in days, the messages never delivered and the initial messages never taken are kept,
# and attachments: the objects' alarms delete them then.
[vars]
RETENTION_DAYS = "30"
FILE_RETENTION_DAYS = "90"
# How long a sign-in lasts.
SESSION_DAYS = "30"

# The secrets PASSWORD, which clients sign in with, as every write takes it, and AUTH_KEY, which
# signs their sign-ins' cookies: set with `npx wrangler secret put`, or in .dev.vars for
# `wrangler dev`, which warns if one is missing; see the README. Without both, nobody can use the
# server.
[secrets]
required = ["PASSWORD", "AUTH_KEY"]
